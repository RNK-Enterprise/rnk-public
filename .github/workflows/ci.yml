name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minecraft-bridge:
    name: Bridge (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-bridge
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx eslint .

      - name: Test
        run: node test.js

  the-tync:
    name: The Tync (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: the-tync
    strategy:
      matrix:
        java: [21]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: the-tync/**/pom.xml

      - name: Build and test
        run: mvn -B -ntp package
